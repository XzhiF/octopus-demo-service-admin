services:
  mysql:
    image: mysql:8.4
    container_name: octopus-demo-system-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: octopus_demo_system
      MYSQL_USER: octopus
      MYSQL_PASSWORD: octopus
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
